<div class="container text-center">
        <div class="row justify-content-center">
@for (movieData of movieService.movies().slice(0,9);track movieData;) {
        <div class="col-md-4 col-sm-6 mb-4 d-flex justify-content-center">
        <div class="card" style="width: 18rem;">
        <img [src]="movieData.Poster" [alt]="movieData.Title" class="card-img-top poster-img">
        {{movieData.Title}}
        {{movieData.Year}}
        <a [routerLink]="['/movie', movieData.imdbID]">View Details</a>
</div>
</div>
}
</div>
</div>
<div class="d-flex justify-content-center mt-4">
<button class="btn btn-secondary me-2" (click)="movieService.previousPage()" [disabled]="movieService.currentPage() ===1">Previous</button>
<button class="btn btn-secondary" (click)="movieService.nextPage()" [disabled]="movieService.currentPage() === movieService.maxPages()">Next</button> 
</div>
